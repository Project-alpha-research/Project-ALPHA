<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      const savedTheme = localStorage.getItem('alpha.theme.v1')
      document.documentElement.dataset.theme = savedTheme === 'dim' || savedTheme === 'dark' ? savedTheme : 'light'
      // The desk (default app) is dark before first paint; the old shell keeps its saved theme.
      if (!/^#(legacy\b|page=|pane=)|[#&]page=/.test(location.hash) && location.pathname !== '/owner-auth/enroll') {
        document.documentElement.dataset.desk = 'v2'
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml" />
    <title>ALPHA Workstation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
