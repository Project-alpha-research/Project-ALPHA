# Setup spec for the nightly example (research/examples/nightly.example.toml). The [exit] table
# lets `alpha setup trade` run after `alpha setup find`. A fixed pipeline check, not an idea.
[setup]
name = "nightly-reclaim-20d"
idea = "Daily close back above the 20-day average after three closes below it"
assets = ["SPY"]
timeframe = "1D"
event = "crosses_above(close, sma(close, 20))"
[filters]
three_below = "prev(for_bars(close < sma(close, 20), 3))"
[study]
horizons = [1, 3, 5, 10]
primary = 5
[exit]
stop = "5 %"
target = "10 %"
time_bars = 10
