# Example config for `alpha rdagent run --config rdagent.toml`. Every path below is a placeholder.
# You do not need to write this by hand: `alpha rdagent init` writes the six paths for this machine.
# Keep any copy outside git.
# Each key has the name of one option of workers/rdagent/factor_loop_launch.py (`--loop-n` is
# `loop_n`). A key left out puts nothing on the command line: the launcher's own default applies.

working_directory = "/abs/path/to/Project-ALPHA"            # the checkout that holds .venv
data_dir = "/abs/path/to/alpha-data"                        # --data-dir
gateway_data_dir = "/abs/path/to/runs/model-gateway-state"  # --gateway-data-dir, outside git
trial_ledger = "/abs/path/to/runs/rdagent-trial-ledger/rdagent-factor-trials.jsonl"
rdagent_source = "/abs/path/to/rdagent-source"         # ALPHA_RDAGENT_SOURCE, from the setup script
factor_python = "/abs/path/to/factor-runtime/bin/python" # ALPHA_FACTOR_PYTHON, from the setup script

# Optional. The values shown are examples, not the launcher's defaults.
# universe = "/abs/path/to/universe.json"
# funding_dir = "/abs/path/to/context-store"
# loop_n = 3
# discuss = true
# discuss_wait_minutes = 20
# discuss_on_timeout = "stop"     # or "proceed"
# wall_seconds = 10800
# chat_route = "api"              # or "codex" or "fake"; "api" also needs api_model and both prices
# api_model = "provider/model-name"
# api_price_in_per_mtok = 0.0
# api_price_out_per_mtok = 0.0
# api_openrouter = true
# key_file = "/abs/path/to/placeholder.env"   # only the PATH; the command never reads it
# Also accepted, same names as the launcher: memory_dir, no_memory, coder_max_loop, run_max_calls,
# embedding_route, provider_embed_model, provider_embed_usd_per_mtok, accept_unhonoured,
# no_router_session, api_timeout, provider_retries, coding_reasoning_tokens, family_switch_after.
